<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Intel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .header p {
      margin-top: 8px;
      color: #8b8b8b;
      font-size: 0.95rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 680px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b8b8b;
      margin-bottom: 8px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      color: #e8e8e8;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: #4f6ef7;
    }

    select option { background: #1a1d27; }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .example-chip {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.78rem;
      color: #8b8b8b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .example-chip:hover {
      border-color: #4f6ef7;
      color: #4f6ef7;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #4f6ef7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }

    button:hover { background: #3d5ce0; }
    button:disabled { background: #2a2d3a; color: #555; cursor: not-allowed; }

    .answer-box {
      margin-top: 28px;
      display: none;
    }

    .answer-meta {
      font-size: 0.78rem;
      color: #8b8b8b;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .answer-text {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 20px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #e8e8e8;
      white-space: pre-wrap;
    }

    .loading {
      display: none;
      text-align: center;
      color: #8b8b8b;
      font-size: 0.9rem;
      margin-top: 20px;
    }

    .dot-anim::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }

    .error-text {
      color: #e05c5c;
      font-size: 0.88rem;
      margin-top: 12px;
      display: none;
    }

    .footer {
      margin-top: 32px;
      font-size: 0.78rem;
      color: #4a4a4a;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>✈️ Travel Intel</h1>
    <p>AI-powered travel insights, updated daily from live data</p>
  </div>

  <div class="card">
    <div class="field">
      <label>City</label>
      <select id="city">
        <option value="">Loading cities...</option>
      </select>
    </div>

    <div class="field">
      <label>Your Question</label>
      <input type="text" id="question"
        placeholder="Should I visit Bangkok this week?" />
      <div class="examples" id="examples"></div>
    </div>

    <button id="askBtn" onclick="ask()" disabled>Ask</button>

    <div class="loading" id="loading">
      <span class="dot-anim">Thinking</span>
    </div>

    <div class="error-text" id="error"></div>

    <div class="answer-box" id="answerBox">
      <div class="answer-meta" id="answerMeta"></div>
      <div class="answer-text" id="answerText"></div>
    </div>
  </div>

  <div class="footer">
    Data refreshed daily · Powered by llama3.2 · Built with FastAPI + MotherDuck
  </div>

<script>
  const EXAMPLE_QUESTIONS = [
    "Should I visit this week?",
    "What's the weather like?",
    "What are the top attractions?",
    "Is it safe to travel there?",
    "What currency do I need?",
  ];

  async function loadCities() {
    const res = await fetch('/cities');
    const data = await res.json();
    const select = document.getElementById('city');
    select.innerHTML = data.cities.map(c =>
      `<option value="${c.slug}">${c.name}</option>`
    ).join('');
    document.getElementById('askBtn').disabled = false;
  }

  function loadExamples() {
    const container = document.getElementById('examples');
    container.innerHTML = EXAMPLE_QUESTIONS.map(q =>
      `<span class="example-chip" onclick="setQuestion('${q}')">${q}</span>`
    ).join('');
  }

  function setQuestion(q) {
    document.getElementById('question').value = q;
  }

  async function ask() {
    const city_slug = document.getElementById('city').value;
    const question = document.getElementById('question').value.trim();

    if (!question) {
      showError('Please enter a question.');
      return;
    }

    setLoading(true);
    hideError();
    hideAnswer();

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ city_slug, question })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || 'Something went wrong.');
      }

      const data = await res.json();
      showAnswer(data);
    } catch (e) {
      showError(e.message);
    } finally {
      setLoading(false);
    }
  }

  function showAnswer(data) {
    document.getElementById('answerMeta').textContent =
      `${data.city} · "${data.question}"`;
    document.getElementById('answerText').textContent = data.answer;
    document.getElementById('answerBox').style.display = 'block';
  }

  function hideAnswer() {
    document.getElementById('answerBox').style.display = 'none';
  }

  function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('error').style.display = 'none';
  }

  function setLoading(on) {
    document.getElementById('loading').style.display = on ? 'block' : 'none';
    document.getElementById('askBtn').disabled = on;
  }

  // Allow Enter key to submit
  document.addEventListener('DOMContentLoaded', () => {
    loadCities();
    loadExamples();
    document.getElementById('question').addEventListener('keydown', e => {
      if (e.key === 'Enter') ask();
    });
  });
</script>

</body>
</html>
